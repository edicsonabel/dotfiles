# El microfono cableado gana al del bluetooth.
#
# El YET-TR6 anuncia Handsfree (HFP), asi que al conectarlo PipeWire puede
# mover la entrada a su microfono — que suena peor y ademas degrada la salida
# a calidad de llamada. Aqui se le baja la prioridad como FUENTE; como salida
# (A2DP) sigue intacto.
#
# El puerto del jack no se fija: el codec declara 'Headset Mic Phantom Jack',
# sin deteccion fisica, y forzarlo dejaria el microfono interno inservible al
# quitar los auriculares. Para eso esta el script `mic`.

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_input.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]
